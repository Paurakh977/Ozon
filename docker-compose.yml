name: ozon

services:

  ozon-postgres:
    image: postgres:16-alpine
    container_name: ozon-postgres
    environment:
      POSTGRES_USER: ozon
      POSTGRES_PASSWORD: ozon69
      POSTGRES_DB: ozon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - ozon-internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ozon} -d ${POSTGRES_DB:-ozon}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: ozon-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ozon.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - ozon-postgres

    networks:
      - ozon-internal

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ozon-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - ozon-internal
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ozon-grpc-server:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: ozon-grpc-server
    env_file:
      - ./service/.env
    ports:
      - "50051:50051"
    restart: unless-stopped
    networks:
      - ozon-internal
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=5)\" && echo ok" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  ozon-microservice:
    build:
      context: ./microservice
      dockerfile: Dockerfile
    container_name: ozon-microservice
    env_file:
      - microservice/.env
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ozon}
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      ozon-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ozon-internal
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/stt', (r) => process.exit(0)).on('error', () => process.exit(1))\"" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  ozon-agent-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ozon-agent-server
    env_file:
      - ./server/.env
    environment:
      UVICORN_HOST: "0.0.0.0"
    ports:
      - "8000:8000"
    depends_on:
      ozon-grpc-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ozon-internal
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/'); sys.exit(0)\" || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  ozonclient:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AGENT_WS_URL: ${NEXT_PUBLIC_AGENT_WS_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: ozonclient
    env_file:
      - .env
    environment:
      GRPC_SERVER_URL: ozon-grpc-server:50051
      NEXT_PUBLIC_AGENT_WS_URL: ws://localhost:8000/ws
      NEXT_PUBLIC_API_URL: http://ozon-microservice:3001
    ports:
      - "3000:3000"
    depends_on:
      ozon-agent-server:
        condition: service_healthy
      ozon-microservice:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ozon-internal

networks:
  ozon-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
