name: ozon

services:

  nginx:
    image: nginx:alpine
    container_name: ozon-nginx
    ports:
      - "80:80"        
      - "443:443"      
      - "50051:50051"  
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - ozonclient
      - ozon-microservice
      - ozon-agent-server
    networks:
      - ozon-internal
    restart: unless-stopped

  ozon-postgres:
    image: postgres:16-alpine
    container_name: ozon-postgres
    environment:
      POSTGRES_USER: ozon
      POSTGRES_PASSWORD: ozon69
      POSTGRES_DB: ozon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # Securely bind to local machine only
    restart: unless-stopped
    networks:
      - ozon-internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ozon} -d ${POSTGRES_DB:-ozon}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: ozon-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ozon.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "127.0.0.1:5050:80" # Securely bind to local machine only
    depends_on:
      - ozon-postgres
    networks:
      - ozon-internal
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ozon-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379" # Securely bind to local machine only
    restart: unless-stopped
    networks:
      - ozon-internal
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ozon-grpc-server:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: ozon-grpc-server
    env_file:
      - ./service/.env
    restart: unless-stopped
    networks:
      - ozon-internal
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=5)\" && echo ok" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  ozon-microservice:
    build:
      context: ./microservice
      dockerfile: Dockerfile
    container_name: ozon-microservice
    env_file:
      - microservice/.env
    environment:
      PORT: "3001"
    depends_on:
      ozon-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ozon-internal
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/stt', (r) => process.exit(0)).on('error', () => process.exit(1))\"" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  ozon-agent-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ozon-agent-server
    env_file:
      - ./server/.env
    depends_on:
      ozon-grpc-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ozon-internal
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/'); sys.exit(0)\" || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  ozonclient:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AGENT_WS_URL: ${NEXT_PUBLIC_AGENT_WS_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: ozonclient
    env_file:
      - .env
    depends_on:
      ozon-agent-server:
        condition: service_healthy
      ozon-microservice:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ozon-internal

networks:
  ozon-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
