name: ozon

services:

  ozon-grpc-server:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: ozon-grpc-server
    env_file:
      - ./service/.env
    ports:
      - "50051:50051"
    restart: unless-stopped
    networks:
      - ozon-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=5)\" && echo ok"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  ozon-microservice:
    build:
      context: ./microservice
      dockerfile: Dockerfile
    container_name: ozon-microservice
    env_file:
      - microservice/.env
    environment:
      PORT: "3001"
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - ozon-internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/stt', (r) => process.exit(0)).on('error', () => process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  ozon-agent-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ozon-agent-server
    env_file:
      - ./server/.env
    environment:
      UVICORN_HOST: "0.0.0.0"
    ports:
      - "8000:8000"
    depends_on:
      ozon-grpc-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ozon-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/'); sys.exit(0)\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  ozonclient:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AGENT_WS_URL: ${NEXT_PUBLIC_AGENT_WS_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: ozonclient
    env_file:
      - .env
    environment:
      GRPC_SERVER_URL: ozon-grpc-server:50051
      NEXT_PUBLIC_AGENT_WS_URL: ws://localhost:8000/ws
      NEXT_PUBLIC_API_URL: http://ozon-microservice:3001
    ports:
      - "3000:3000"
    depends_on:
      ozon-agent-server:
        condition: service_healthy
      ozon-microservice:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ozon-internal

networks:
  ozon-internal:
    driver: bridge
    internal: false   # set true later with nginx/traefik