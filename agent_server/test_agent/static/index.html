<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Chat</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f0f0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #app {
    width: 100%;
    max-width: 760px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-left: 1px solid #e5e5e5;
    border-right: 1px solid #e5e5e5;
  }

  /* Header */
  #header {
    padding: 14px 20px;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
  }
  #header h1 { font-size: 15px; font-weight: 600; }

  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  #status-dot.connected    { background: #22c55e; }
  #status-dot.connecting   { background: #f59e0b; }
  #status-dot.disconnected { background: #ef4444; }
  #status-label { font-size: 12px; color: #888; }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .msg { display: flex; flex-direction: column; max-width: 82%; gap: 4px; }
  .msg.user  { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.65;
    word-break: break-word;
  }
  .msg.user  .bubble { background: #000; color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: #f4f4f5; color: #111; border-bottom-left-radius: 4px; min-width: 60px; }
  .msg.agent .bubble.streaming { opacity: 0.85; }

  /* Markdown inside bubbles */
  .bubble p  { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h1,.bubble h2,.bubble h3 { margin: 10px 0 4px; font-size: 1em; font-weight: 700; }
  .bubble ul,.bubble ol { padding-left: 18px; margin: 4px 0; }
  .bubble li { margin: 2px 0; }
  .bubble pre { background: #1e1e1e; color: #d4d4d4; padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-size: 13px; }
  .bubble code { background: rgba(0,0,0,0.08); padding: 1px 5px; border-radius: 4px; font-size: 13px; font-family: monospace; }
  .bubble pre code { background: transparent; padding: 0; color: inherit; }
  .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; width: 100%; }
  .bubble th,.bubble td { border: 1px solid #d1d5db; padding: 6px 10px; }
  .bubble th { background: #f3f4f6; font-weight: 600; }
  .bubble tr:nth-child(even) td { background: #fafafa; }
  .katex-display { margin: 8px 0; overflow-x: auto; overflow-y: hidden; }

  /* Typing cursor */
  .cursor::after {
    content: '▋';
    animation: blink 0.7s step-end infinite;
    color: #555; font-size: 12px;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Input area */
  #input-area {
    border-top: 1px solid #e5e5e5;
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    background: #fff;
    align-items: flex-end;
  }
  #prompt {
    flex: 1; resize: none;
    border: 1px solid #d1d5db; border-radius: 10px;
    padding: 9px 12px; font-size: 14px; font-family: inherit;
    line-height: 1.5; outline: none;
    max-height: 160px; overflow-y: auto;
    transition: border-color 0.2s;
  }
  #prompt:focus { border-color: #888; }

  #sendBtn {
    width: 38px; height: 38px; border-radius: 50%;
    background: #000; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: opacity 0.2s;
  }
  #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; }
  #sendBtn svg { fill: #fff; width: 16px; height: 16px; }

  /* Empty state */
  #empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; color: #aaa; font-size: 14px; pointer-events: none;
  }
  #empty svg { opacity: 0.25; }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <div id="status-dot" class="connecting"></div>
    <h1>Agent</h1>
    <span id="status-label">Connecting…</span>
  </div>

  <div id="messages">
    <div id="empty">
      <svg width="36" height="36" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      Send a message to start
    </div>
  </div>

  <div id="input-area">
    <textarea id="prompt" placeholder="Message…" rows="1" disabled></textarea>
    <button id="sendBtn" disabled title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
marked.setOptions({ breaks: true });

// ── Helpers ──────────────────────────────────────────────────────────────

function renderContent(text) {
  const segments = [];
  const protected_ = text.replace(
    /(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|(?<!\\)\$[^\n$]*?(?<!\\)\$)/g,
    (m) => { segments.push(m); return `%%%M${segments.length - 1}%%%`; }
  );

  let html = marked.parse(protected_);

  html = html.replace(/%%%M(\d+)%%%/g, (_, i) => {
    const raw = segments[+i];
    let math = raw, display = false;
    if (raw.startsWith('$$'))       { math = raw.slice(2, -2); display = true; }
    else if (raw.startsWith('\\[')) { math = raw.slice(2, -2); display = true; }
    else if (raw.startsWith('\\(')) { math = raw.slice(2, -2); }
    else if (raw.startsWith('$'))   { math = raw.slice(1, -1); }
    try { return katex.renderToString(math, { displayMode: display, throwOnError: false }); }
    catch { return raw; }
  });

  return html;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function scrollBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

// ── State ────────────────────────────────────────────────────────────────

let ws = null;
let busy = false;
let currentAgentBubble = null;

const messagesEl = document.getElementById('messages');
const emptyEl    = document.getElementById('empty');
const promptEl   = document.getElementById('prompt');
const sendBtn    = document.getElementById('sendBtn');
const statusDot  = document.getElementById('status-dot');
const statusLbl  = document.getElementById('status-label');

function setStatus(state, label) {
  statusDot.className = state;
  statusLbl.textContent = label;
}

function addMessage(role, html, streaming = false) {
  emptyEl.style.display = 'none';
  const wrap   = document.createElement('div');
  wrap.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (streaming ? ' streaming cursor' : '');
  bubble.innerHTML = html;
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollBottom();
  return bubble;
}

function setReady(ready) {
  promptEl.disabled = !ready;
  sendBtn.disabled  = !ready || busy;
  if (ready && !busy) promptEl.focus();
}

// ── WebSocket — one connection for the whole conversation ─────────────────

function connect() {
  setStatus('connecting', 'Connecting…');
  setReady(false);
  ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onopen = () => {
    setStatus('connected', 'Connected');
    setReady(true);
  };

  ws.onmessage = ({ data }) => {
    const msg = JSON.parse(data);

    if (msg.type === 'chunk') {
      if (!currentAgentBubble) {
        currentAgentBubble = addMessage('agent', '', true);
      }
      currentAgentBubble.innerHTML = renderContent(msg.text);
      scrollBottom();
    }
    else if (msg.type === 'done') {
      if (currentAgentBubble) {
        currentAgentBubble.classList.remove('streaming', 'cursor');
        currentAgentBubble = null;
      }
      busy = false;
      setReady(true);
    }
    else if (msg.type === 'error') {
      if (currentAgentBubble) {
        currentAgentBubble.classList.remove('streaming', 'cursor');
        currentAgentBubble = null;
      }
      addMessage('agent', `<span style="color:#ef4444">Error: ${msg.text}</span>`);
      busy = false;
      setReady(true);
    }
  };

  ws.onclose = () => {
    setStatus('disconnected', 'Disconnected — refresh to reconnect');
    setReady(false);
    busy = false;
  };

  ws.onerror = () => {
    setStatus('disconnected', 'Connection error');
  };
}

// ── Send ─────────────────────────────────────────────────────────────────

function send() {
  const text = promptEl.value.trim();
  if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;

  addMessage('user', marked.parse(text));
  promptEl.value = '';
  autoResize(promptEl);

  busy = true;
  currentAgentBubble = null;
  sendBtn.disabled = true;

  ws.send(text);
  scrollBottom();
}

sendBtn.addEventListener('click', send);

promptEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

promptEl.addEventListener('input', () => autoResize(promptEl));

// ── Boot — establish connection on page load ──────────────────────────────

connect();
</script>
</body>
</html>
