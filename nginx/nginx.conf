worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Production-Grade Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upstreams (Points to your Docker container names)
    upstream nextjs_client { server ozonclient:3000; }
    upstream nestjs_api    { server ozon-microservice:3001; }
    upstream fastapi_agent { server ozon-agent-server:8000; }

    # 1. Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # 2. Main HTTPS Server (Web & API Gateway)
    server {
        listen 443 ssl http2;
        server_name localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # Modern SSL Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Frontend (Next.js)
        location / {
            proxy_pass http://nextjs_client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Microservice API (NestJS)
        # Strips /api/ and sends to NestJS. E.g., https://localhost/api/users -> http://ozon-microservice:3001/users
        location /api/ {
            proxy_pass http://nestjs_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI Agent (WebSockets Support)
        location /ws {
            proxy_pass http://fastapi_agent/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;       # Crucial for WebSockets
            proxy_set_header Connection "Upgrade";        # Crucial for WebSockets
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;                     # Prevent WS connection drop
        }
    }

    # 3. gRPC Server over TLS
    server {
        listen 50051 ssl http2;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        location / {
            grpc_pass grpc://ozon-grpc-server:50051;
            grpc_set_header X-Real-IP $remote_addr;
        }
    }
}