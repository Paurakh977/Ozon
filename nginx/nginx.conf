worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Request Size Limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Proxy Buffers
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 24k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Production-Grade Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upstreams (Points to your Docker container names)
    upstream nextjs_client { 
        server ozonclient:3000; 
        keepalive 32;
    }
    upstream nestjs_api { 
        server ozon-microservice:3001; 
        keepalive 16;
    }
    upstream fastapi_agent { 
        server ozon-agent-server:8000; 
        keepalive 32;
    }

    # 1. Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # 2. Main HTTPS Server (Web & API Gateway)
    server {
        listen 443 ssl http2;
        server_name localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # Modern SSL Configuration & Session Cache
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Frontend (Next.js)
        location / {
            limit_req zone=general_limit burst=50 nodelay;
            proxy_pass http://nextjs_client;
            
            # Keepalive configuration
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Microservice API (NestJS) Auth Endpoints - Stricter limits
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://nestjs_api;
            
            # Keepalive configuration
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Microservice API (NestJS) General
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://nestjs_api;
            
            # Keepalive configuration
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # FastAPI Agent (WebSockets Support)
        location /ws {
            limit_req zone=ws_limit burst=20 nodelay;
            proxy_pass http://fastapi_agent/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;       # Crucial for WebSockets
            proxy_set_header Connection "Upgrade";        # Crucial for WebSockets
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;                     # Prevent WS connection drop
        }
    }

    # 3. gRPC Server over TLS
    server {
        listen 50051 ssl http2;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # Session cache for gRPC as well
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        location / {
            grpc_pass grpc://ozon-grpc-server:50051;
            grpc_set_header X-Real-IP $remote_addr;
        }
    }
}
